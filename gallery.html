<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | ABC Fitness Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>ABC Fitness Studio</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="classes.html">Classes</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Fitness Gallery</h2>

        <div class="gallery">
            <figure>
                <img src="images/yoga.svg" alt="Participants practicing yoga">
                <figcaption>Relaxing yoga sessions</figcaption>

                 <button type="button" onclick="addToCart()">
    Add to Cart
  </button>
</figure>
            </figure>

            <figure>
                <img src="images/pilates.svg" alt="Participants practicing Pilates">
                <figcaption>Strength-building Pilates classes</figcaption>

             <button type="button" onclick="addToCart()">
    Add to Cart
  </button>
</figure>
            </figure>

            <figure>
                <img src="images/zumba.svg" alt="Participants attending a Zumba class">
                <figcaption>Energetic Zumba workouts</figcaption>

                 <button type="button" onclick="addToCart()">
    Add to Cart
  </button>
</figure>
            </figure>
        </div>
    </main>

<footer>
  <h2>Stay Connected</h2>

  <label for="subscribe-email">Email Address:</label>

  <input
    type="email"
    id="subscribe-email"
    name="subscribe-email"
    placeholder="Enter your email"
  >

  <button type="button" onclick="subscribeUser()">
    Subscribe
  </button>

  <p>&copy; 2026 ABC Fitness Studio</p>
</footer>

<script src="script.js"></script>
</body>
</html>
