<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ABC Fitness Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>ABC Fitness Studio</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="classes.html">Classes</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>About Us</h2>

        <p>
            ABC Fitness Studio is a local wellness center offering yoga,
            Pilates, Zumba, and fitness equipment for members of the
            community.
        </p>

        <h2>Contact Us</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="class-interest">Class Interest:</label>
            <select id="class-interest" name="class-interest">
                <option value="">Select a class</option>
                <option value="yoga">Yoga</option>
                <option value="pilates">Pilates</option>
                <option value="zumba">Zumba</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6"></textarea>

            <button type="submit">Send Message</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 ABC Fitness Studio</p>
    </footer>

</body>
</html>
